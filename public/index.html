<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa de ayuda</title>
  <!-- Tailwind por CDN: hace falta internet para que carguen los estilos -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="app.js" defer></script>
</head>
<!--
  Esta página todavía no tiene ninguna clase de Tailwind, por eso se ve
  tan plana. Darle forma es el nivel 0 del enunciado.
  Puedes añadir clases y contenedores, pero no cambies los id: app.js
  depende de ellos.
-->
<body class="bg-blue-50 text-slate-800">

  <header class="bg-blue-50 text-slate-800">
    <h1 class="ml-3 font-bold text-2xl text-blue-600">Mesa de ayuda</h1>
    <p class="ml-3 text-lg">Tickets de soporte de la oficina</p>

  </header>

  <main class="p-4 lg:p-6">
    <div class="flex flex-col lg:flex-row lg:gap-6">
      <!-- Formulario: crea tickets y, desde el nivel 4, también los edita -->
      <section class="bg-blue-200 border-blue-200 rounded p-4 lg:w-1/3">

        <h2 id="titulo-formulario" class="text-lg font-semibold mb-4">Nuevo ticket</h2>

        <form id="form-ticket" novalidate>

          <div class="flex flex-col">
            <label for="titulo" class="mt-4 mb-1 text-md font-medium text-slate-700">Título</label>
            <input id="titulo" name="titulo" type="text"
                  class="w-full border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <p id="error-titulo" class="text-sm text-red-600 mt-1"></p>
          </div>

          <div class="flex flex-col">
            <label for="descripcion" class="mt-4 mb-1 text-md font-medium text-slate-700">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="3"
                      class="w-full border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </textarea>
          </div>

          <div class="flex flex-col">
            <label for="solicitante" class="mt-4 mb-1 text-md font-medium text-slate-700">
              Solicitante
            </label>
            <input id="solicitante" name="solicitante" type="text"
                   class="w-full border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <p id="error-solicitante" class="text-sm text-red-600 mt-1"></p>
          </div>

          <div class="flex flex-col">
            <div class="flex flex-row mt-4">
              <label for="categoria" class="mr-4 mb-1 text-md font-medium text-slate-700">Categoría</label>
              <select id="categoria" name="categoria" class="w-full border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="hardware">Hardware</option>
                <option value="software">Software</option>
                <option value="red">Red</option>
                <option value="accesos">Accesos</option>
              </select>
            </div>

            <div class="flex flex-row mt-4">
              <label for="prioridad" class="mr-5 mb-1 text-md font-medium text-slate-700">Prioridad</label>
              <select id="prioridad" name="prioridad" class="w-full border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="baja">Baja</option>
                <option value="media" selected>Media</option>
                <option value="alta">Alta</option>
              </select>
            </div>
          </div>

            <button id="btn-guardar" type="submit"
                    class="font-medium mt-4 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors duration-200">
            Crear ticket
            </button>


            <button id="btn-cancelar" type="button" hidden
                    class="font-medium mt-4 ml-2 bg-gray-200 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-300 transition-colors duration-200">
              Cancelar edición
            </button>
        </form>
      </section>

      <!-- Tablero -->
      <section class="mt-4 lg:mt-0 bg-blue-100 border-blue-200 rounded p-6 lg:w-2/3">
        <h2 class="font-semibold text-lg mb-4">Tickets</h2>

        <div id="resumen" class="text-sm text-slate-600 mb-4"></div>

        <div class="flex flex-col md:flex-row gap-3 mb-4">
          <div class="flex flex-col">
            <label for="filtro-estado" class="font-medium text-md mb-1">Estado</label>
              <select id="filtro-estado" class="w-full border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="todos">Todos</option>
                <option value="abierto">Abiertos</option>
                <option value="en_progreso">En progreso</option>
                <option value="resuelto">Resueltos</option>
              </select>
          </div>

          <div class="flex flex-col flex-1">
            <label for="busqueda" class="mb-1 font-medium text-md">Buscar</label>
            <input id="busqueda" type="search" placeholder="Buscar por título" class="p-2 border border-gray-500 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>

        </div>

        <p id="mensaje" class="text-sm text-slate-600 mb-4"></p>

        <div id="lista-tickets" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </section>
    </div>
  </main>

</body>
</html>
